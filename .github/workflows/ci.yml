name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: test ! -f Cargo.toml || cargo fmt --all -- --check
      - name: Test
        run: test ! -f Cargo.toml || cargo test --all-targets --all-features
      - name: Check
        run: test ! -f Cargo.toml || cargo check --all-targets --all-features
      - name: Clippy
        run: test ! -f Cargo.toml || cargo clippy --all-targets --all-features -- -D warnings
